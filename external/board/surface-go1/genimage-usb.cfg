# Outer live USB: its DATA contains the separate pristine installation image.
image data-usb.ext4 {
    ext4 {
        label = "SURFACE_DATA"
        use-mke2fs = true
        root-owner = "0:0"
    }
    size = 4G
    srcpath = "@INSTALLER_DATA_ROOT@"
}
image surface-go.img {
    hdimage { partition-table-type = "gpt" }
    partition boot {
        partition-type-uuid = U
        image = "efi.vfat"
        offset = 1M
        bootable = true
    }
    partition root {
        partition-type-uuid = 44479540-f297-41b2-9af7-d131d5f0458a
        partition-uuid = 8b4a530e-d6d4-4e69-9307-310000000001
        image = "rootfs.ext4"
    }
    partition data {
        partition-type-uuid = L
        partition-uuid = 8b4a530e-d6d4-4e69-9307-310000000002
        image = "data-usb.ext4"
    }
}
