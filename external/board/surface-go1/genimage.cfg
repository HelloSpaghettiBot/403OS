image efi.vfat {
    vfat {
        file EFI { image = "efi-part/EFI" }
        file bzImage { image = "bzImage" }
    }
    size = 64M
}
image data.ext4 {
    ext4 {
        label = "SURFACE_DATA"
        use-mke2fs = true
    }
    size = 4G
    empty = true
}
image surface-go-base.img {
    hdimage { partition-table-type = "gpt" }
    partition boot {
        partition-type-uuid = U
        image = "efi.vfat"
        offset = 1M
        bootable = true
    }
    partition root {
        partition-type-uuid = 44479540-f297-41b2-9af7-d131d5f0458a
        partition-uuid = 8b4a530e-d6d4-4e69-9307-310000000001
        image = "rootfs.ext4"
    }
    partition data {
        partition-type-uuid = L
        partition-uuid = 8b4a530e-d6d4-4e69-9307-310000000002
        image = "data.ext4"
    }
}
